services:
  - type: web
    name: smartfarm-backend
    env: python
    buildCommand: |
      pip install -r backend/requirements.txt
      python backend/manage.py migrate
    startCommand: |
      cd backend && gunicorn smartfarm_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: smartfarm_backend.settings
      - key: PYTHONPATH
        value: /opt/render/project/src/backend:/opt/render/project/src