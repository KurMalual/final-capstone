services:
  - type: web
    name: uninest-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn smartfarm_backend.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: smartfarm_backend.settings
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: final-capstone-jm3o.onrender.com
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
