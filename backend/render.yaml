services:
  - type: web
    name: uninest-backend
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn smartfarm_backend.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: smartfarm_backend.settings
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "your-app.onrender.com"
